<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>IMS Desktop</title>
  <link rel="icon" type="image/x-icon" href="assets/bookshop-logo.ico">
  <link rel="icon" type="image/png" href="assets/bookshop-logo.png">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container {
      max-width: 500px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    p {
      font-size: 1.1em;
      opacity: 0.9;
      line-height: 1.6;
    }

    .url {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px;
      border-radius: 10px;
      font-family: monospace;
      margin: 20px 0;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>IMS Desktop</h1>
    <div class="spinner"></div>
    <p>Loading IMS System...</p>
    <div class="url">https://ug2002019.cse.pstu.ac.bd/ims-web/public/admin</div>
    <p>Please wait while we connect to the server.</p>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
